name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build .app (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build app bundle (universal)
        run: UNIVERSAL=1 bash scripts/build_app.sh

      - name: Package zip
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Matrix.app Matrix.zip
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Matrix-macos
          path: dist/Matrix.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Matrix.zip
          generate_release_notes: true
